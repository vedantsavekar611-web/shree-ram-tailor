<!DOCTYPE html>
<html>
<head>
    <title>Book Your Stitching</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Book Your Stitching</h1><br><hr><br>

    <form onsubmit="sendWhatsApp(); return false;">

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name" required><br><br>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter mobile number" required><br><br>

        <label>Service</label>
        <select id="service">
            <option>Shirt Tailoring</option>
            <option>Pant Tailoring</option>
            <option>Both Shirt & Pant Tailoring</option>
            <option>Safari Tailoring</option>
            <option>Alteration</option>
        </select><br><br>

        <label>Message</label><br>
        <textarea id="message" placeholder="Enter your requirements"></textarea><br><br>

        <button type="submit">Send Booking on WhatsApp</button>

    </form>


    <script>
        function sendWhatsApp() {

            var name = document.getElementById("name").value;
            var mobile = document.getElementById("mobile").value;
            var service = document.getElementById("service").value;
            var message = document.getElementById("message").value;

            var whatsappNumber = "918446711721";

            var text =
                "New Tailoring Booking%0A%0A" +
                "Name: " + name + "%0A" +
                "Mobile: " + mobile + "%0A" +
                "Service: " + service + "%0A" +
                "Requirements: " + message;

            var url = "https://wa.me/" + whatsappNumber + "?text=" + text;

            window.open(url, "_blank");
        }
    </script>

</body>
</html>
